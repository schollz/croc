name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '^1.26.0'

      - name: Prepare source tarball
        run: |
          git clone -b ${{ github.event.release.name }} --depth 1 https://github.com/schollz/croc croc-${{ github.event.release.name }}
          cd croc-${{ github.event.release.name }} && go mod tidy && go mod vendor
          cd .. && tar -czvf croc_${{ github.event.release.name }}_src.tar.gz croc-${{ github.event.release.name }}

      - name: Upload source artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-tarball
          path: "*.tar.gz"

  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          # Windows builds
          - goos: windows
            goarch: amd64
            name: Windows-64bit
            ext: .exe
            archive: zip
          - goos: windows
            goarch: "386"
            name: Windows-32bit
            ext: .exe
            archive: zip
          - goos: windows
            goarch: arm64
            name: Windows-ARM64
            ext: .exe
            archive: zip
          
          # Linux builds
          - goos: linux
            goarch: amd64
            name: Linux-64bit
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: "386"
            name: Linux-32bit
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm
            name: Linux-ARM
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm
            goarm: "5"
            name: Linux-ARMv5
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            name: Linux-ARM64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: riscv64
            name: Linux-RISCV64
            ext: ""
            archive: tar.gz
          
          # macOS builds
          - goos: darwin
            goarch: amd64
            name: macOS-64bit
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            name: macOS-ARM64
            ext: ""
            archive: tar.gz
          
          # BSD builds
          - goos: dragonfly
            goarch: amd64
            name: DragonFlyBSD-64bit
            ext: ""
            archive: tar.gz
          - goos: freebsd
            goarch: amd64
            name: FreeBSD-64bit
            ext: ""
            archive: tar.gz
          - goos: freebsd
            goarch: arm64
            name: FreeBSD-ARM64
            ext: ""
            archive: tar.gz
          - goos: netbsd
            goarch: "386"
            name: NetBSD-32bit
            ext: ""
            archive: tar.gz
          - goos: netbsd
            goarch: amd64
            name: NetBSD-64bit
            ext: ""
            archive: tar.gz
          - goos: netbsd
            goarch: arm64
            name: NetBSD-ARM64
            ext: ""
            archive: tar.gz
          - goos: openbsd
            goarch: amd64
            name: OpenBSD-64bit
            ext: ""
            archive: tar.gz
          - goos: openbsd
            goarch: arm64
            name: OpenBSD-ARM64
            ext: ""
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '^1.26.0'

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          # Strip symbols, DWARF, build IDs, source paths, and VCS metadata.
          case "${{ matrix.goos }}" in
            "darwin")
              LDFLAGS='-s -w -buildid= -extldflags "-sectcreate __TEXT __info_plist Info.plist"'
              ;;
            *)
              LDFLAGS='-s -w -buildid= -extldflags "-static"'
              ;;
          esac
          
          echo "Building for ${{ matrix.goos }}/${{ matrix.goarch }} with LDFLAGS: $LDFLAGS"
          go build -buildvcs=false -trimpath -tags netgo,osusergo -ldflags "$LDFLAGS" -o croc${{ matrix.ext }}

      - name: Create archive
        run: |
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip croc_${{ github.event.release.name }}_${{ matrix.name }}.zip croc${{ matrix.ext }} LICENSE src/codephrase/wordlists/LICENSE.txt
          else
            tar -czvf croc_${{ github.event.release.name }}_${{ matrix.name }}.tar.gz croc${{ matrix.ext }} LICENSE src/codephrase/wordlists/LICENSE.txt
          fi

      - name: Upload unsigned Windows 64-bit artifact for signing
        if: github.event_name == 'release' && matrix.goos == 'windows' && matrix.goarch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-Windows-64bit
          path: "*.zip"
          retention-days: 1

      - name: Upload build artifact
        if: github.event_name != 'release' || matrix.goos != 'windows' || matrix.goarch != 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.name }}
          path: |
            *.zip
            *.tar.gz

  build-web:
    name: Build croc-web for Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '^1.26.0'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded web client
        run: |
          npm ci --prefix web
          npm run embed --prefix web

      - name: Build and archive croc-web
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -buildvcs=false -trimpath -tags netgo,osusergo \
            -ldflags='-s -w -buildid= -extldflags "-static"' \
            -o croc-web ./cmd/croc-web
          tar -czvf croc-web_${{ github.event.release.name }}_Linux-amd64.tar.gz \
            croc-web LICENSE src/codephrase/wordlists/LICENSE.txt

      - name: Upload croc-web artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-croc-web-Linux-amd64
          path: "croc-web_*.tar.gz"

  sign-windows-amd64:
    name: Sign Windows 64-bit release
    needs: build
    if: github.event_name == 'release'
    runs-on: windows-latest
    steps:
      - name: Download unsigned Windows 64-bit artifact
        uses: actions/download-artifact@v8
        with:
          name: unsigned-Windows-64bit
          path: unsigned

      - name: Prepare binary for signing
        shell: powershell
        run: |
          $archives = @(Get-ChildItem -Path "${{ github.workspace }}\unsigned" -Filter "croc_*_Windows-64bit.zip" -File)
          if ($archives.Count -ne 1) {
            throw "Expected exactly one Windows 64-bit ZIP, found $($archives.Count)."
          }

          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath "${{ github.workspace }}\signed"

          $executables = @(Get-ChildItem -Path "${{ github.workspace }}\signed" -Filter "*.exe" -File -Recurse)
          if ($executables.Count -ne 1 -or $executables[0].Name -ne "croc.exe") {
            throw "Expected exactly one executable named croc.exe, found: $($executables.FullName -join ', ')."
          }

      - name: Sign Windows 64-bit binary
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files: ${{ github.workspace }}/signed/croc.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature and recreate archive
        shell: powershell
        run: |
          $binary = "${{ github.workspace }}\signed\croc.exe"
          $signature = Get-AuthenticodeSignature -FilePath $binary
          $signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate

          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "The croc.exe Authenticode signature is not valid: $($signature.StatusMessage)"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "The croc.exe Authenticode signature does not contain a timestamp certificate."
          }

          $archives = @(Get-ChildItem -Path "${{ github.workspace }}\unsigned" -Filter "croc_*_Windows-64bit.zip" -File)
          $destination = Join-Path "${{ github.workspace }}" $archives[0].Name
          Compress-Archive -Path "${{ github.workspace }}\signed\*" -DestinationPath $destination -CompressionLevel Optimal

      - name: Upload signed Windows 64-bit artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-Windows-64bit
          path: "croc_*_Windows-64bit.zip"

  release:
    needs: [prepare-source, build, build-web, sign-windows-amd64]
    runs-on: ubuntu-24.04
    if: github.event_name == 'release'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true

      - name: Download source artifact
        uses: actions/download-artifact@v8
        with:
          name: source-tarball

      - name: Generate checksums
        run: |
          # Generate SHA256 checksums for all archives
          sha256sum *.zip *.tar.gz > croc_${{ github.event.release.name }}_checksums.txt
          
          # Display the checksums file for verification
          echo "Generated checksums:"
          cat croc_${{ github.event.release.name }}_checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz
            *_checksums.txt
